[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "B905"]
"evaluation/*" = ["E501"]
"app/generation/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]