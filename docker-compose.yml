services:
  api:
    build: .
    image: enterprise-rag
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/code/data
      - hf_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hf_cache: